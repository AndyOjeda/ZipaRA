<div class="min-h-screen bg-gray-50 pb-10">

  <!-- 🖼 Portada con botón de regreso -->
  <div class="relative w-full h-72">
    <img 
      [src]="blog?.imagen"
      alt="Blog Image"
      class="w-full h-full object-cover"
    />

    <!-- Botón atrás sobre la imagen -->
    <button 
      (click)="goBack()"
      class="absolute top-4 left-4 bg-white/80 backdrop-blur p-3 rounded-full shadow hover:bg-white transition"
    >
      <i class="pi pi-arrow-left text-gray-700 text-lg"></i>
    </button>
  </div>

  <!-- 📝 Títulos -->
  <div class="px-6 mt-6 text-center">

    <p class="text-green-700 font-semibold text-sm tracking-wide">
      {{ blog?.subtitulo }}
    </p>

    <h1 class="text-3xl font-bold text-gray-900 mt-2 leading-snug">
      {{ blog?.titulo }}
    </h1>

    <p class="text-gray-500 text-sm mt-1">
      Publicado en Zipaquirá · {{ today | date:'mediumDate' }}
    </p>
  </div>

  <!-- ✏ Contenido -->
  <div class="prose prose-gray max-w-full px-6 mt-8 text-gray-800">

    <p class="text-lg text-center leading-relaxed">
      {{ blog?.contenido.introduccion }}
    </p>

    <ng-container *ngFor="let sec of blog?.contenido.secciones">
      <h2 class="text-2xl font-semibold mt-10 text-gray-900 text-center">
        {{ sec.titulo }}
      </h2>
      <p class="mt-3 leading-relaxed text-justify">
        {{ sec.texto }}
      </p>
    </ng-container>

  </div>

  <div class="h-12"></div>
</div>
